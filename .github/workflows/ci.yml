name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v7
      - name: Установить Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Установить зависимости libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Собрать проект
        run: make build
      - name: Запустить тесты
        run: make test
      - name: Проверить код
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v7
      - name: Установить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Установить зависимости веба
        run: make web-install
      - name: Проверить логику веба
        run: make web-test
      - name: Проверить TypeScript и собрать веб
        run: make web-build
